name: Capture tutorial screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-blog-screenshots.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture actual game screens
        run: node scripts/capture-blog-screenshots.cjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blog/images/screenshot-*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture real beginner gameplay screenshots"
            git push
          fi
