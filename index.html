<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大航海商人アカデミー</title><style>body{font-family:system-ui,sans-serif;background:#f5f0e4;color:#243344;margin:0}main{max-width:800px;margin:auto;padding:24px}header{background:#12394a;color:white;padding:20px;border-radius:16px}section{background:white;padding:20px;border-radius:14px;margin-top:16px}button{background:#176c76;color:white;border:0;border-radius:9px;padding:12px 18px;margin:5px;cursor:pointer}button:disabled{opacity:.4}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{background:#e9f4f0;padding:12px;border-radius:8px;flex:1}small{color:#546} .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare>div{padding:14px;background:#e9f4f0;border-radius:12px}.bar{height:18px;background:#ddd;border-radius:9px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#277c70}.origin{display:flex;height:85px;border-radius:9px;overflow:hidden}.origin>span{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}.origin .capital{background:#437fb7;color:white;flex:100}.origin .gain{background:#e7b45c;flex:30}.explain{background:#e9f4f0;padding:12px;border-radius:9px}#simulator input{width:100%}tr[data-i]{cursor:pointer} </style></head><body><main><header><h1>⛵ 大航海商人アカデミー</h1><p>1500年の港町で、金貨と帳簿の秘密を探ろう！</p></header><section><h2 id="chapter">冒険のはじまり</h2><p id="story"></p><div class="stats"><div>💰 現金 <strong id="cash"></strong></div><div>📦 商品 <strong id="stock"></strong></div><div>📈 利益 <strong id="profit"></strong></div></div><div id="actions"></div><p id="feedback" aria-live="polite"></p></section><section><h2>📖 商人の仕訳帳</h2><p><small>左（借方）と右（貸方）は、いつも同じ金額になるよ。</small></p><p>行をタップすると、取引の意味がわかるよ。</p><table><thead><tr><th>出来事</th><th>借方（左）</th><th>貸方（右）</th></tr></thead><tbody id="ledger"></tbody></table><p id="entryExplain" class="explain">取引をタップしてみよう。</p></section><section><h2>① いくら儲かった？（損益計算書）</h2><div id="profitCard"></div><h2>② 財産はどこから来た？（貸借対照表）</h2><div id="report"></div><div id="simulator"></div><button id="reset">最初から遊ぶ</button><button id="export">セーブをJSONで保存</button><input type="file" id="import" accept="application/json" aria-label="JSONセーブを読み込む"></section><section><small>史実：複式簿記は大航海時代以前のイタリア商人の間で発達しました。この物語と金貨の金額は架空です。</small></section></main><script type="module" src="./src.js"></script></body></html>
