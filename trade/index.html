<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由経営モード｜大航海商人アカデミー</title><link rel="stylesheet" href="./style.css"></head>
<body><main>
<header class="hero"><div class="heading"><div><h1>⛵ 自由経営モード</h1><p>港をめぐって、商売と複式簿記を学ぼう</p></div><button id="guideBtn" class="light">遊び方</button></div><div id="summary" class="summary"></div></header>
<nav class="tabs" role="tablist" aria-label="ゲームの画面"><button role="tab" id="tab-trade" aria-controls="panel-trade" aria-selected="true" data-tab="trade">🛒 売買</button><button role="tab" id="tab-journal" aria-controls="panel-journal" aria-selected="false" data-tab="journal">📖 仕訳帳</button><button role="tab" id="tab-report" aria-controls="panel-report" aria-selected="false" data-tab="report">📊 決算書</button></nav>
<section role="tabpanel" id="panel-trade" aria-labelledby="tab-trade">
<h2>港の相場表</h2><p class="hint">買う値段と売る値段は同じ。すべて金貨／1単位です。</p><div class="table-wrap"><table id="prices"><thead><tr><th>港</th><th>🧺 コショウ</th><th>🧵 絹織物</th><th>🏺 ガラス</th></tr></thead><tbody></tbody></table></div>
<h2>商品を売買する</h2><div class="form"><label>買う・売る<select id="kind"><option value="buy">買う</option><option value="sell">売る</option></select></label><label>商品<select id="good"><option value="pepper">コショウ（袋）</option><option value="silk">絹織物（反）</option><option value="glass">ガラス製品（個）</option></select></label><label>数量<input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></label></div>
<p id="holding" class="hint"></p><button id="checkTrade">取引内容を確認する</button><div id="tradePreview" class="preview" hidden></div>
<hr><h2>次の港へ</h2><p id="nextPort"></p><button id="checkSail">出航内容を確認する</button><div id="sailPreview" class="preview" hidden></div><button id="closeBtn" hidden>この航海を決算する</button><button id="specialBtn" hidden>特別決算して終了</button>
</section>
<section role="tabpanel" id="panel-journal" aria-labelledby="tab-journal" hidden><h2>商会の仕訳帳</h2><p class="hint">ひとつの取引を、借方（左）と貸方（右）に同じ金額で記録します。</p><div id="journal"></div></section>
<section role="tabpanel" id="panel-report" aria-labelledby="tab-report" hidden><h2>決算書（いつでも確認できます）</h2><div id="report"></div></section>
<section id="outcome" hidden><h2>🏆 航海の結果と学び</h2><div id="result"></div><div class="actions"><button id="continueBtn">財産を引き継いで次の航海へ</button><button id="restartBtn" class="light">最初からやり直す</button></div></section>
<p id="message" role="status" aria-live="polite"></p>
<footer><a href="../">← 大航海商人アカデミーへ</a><p>相場は学習用の架空価格です。帳簿の数字は金貨の枚数で表します。</p></footer>
</main><dialog id="guide"><h2>⛵ はじめての商人ガイド</h2><p id="guideStep"></p><div class="actions"><button id="guideBack" class="light">もどる</button><button id="guideNext">つぎへ</button><button id="guideSkip" class="light">スキップ</button></div></dialog><script type="module" src="./app.js"></script></body></html>
