<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レモネード屋さんの商人チャレンジ！｜大航海商人アカデミー</title><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="icon" href="../../favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="../../apple-touch-icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e4;color:#233747;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:14px}header{background:#153f50;color:white;padding:22px;border-radius:18px}h1{font-size:clamp(1.45rem,5vw,2rem);margin:0}h2{font-size:1.35rem;line-height:1.5}p{line-height:1.7}section{background:white;border-radius:18px;padding:20px;margin-top:15px}button{font:inherit;cursor:pointer;border-radius:12px;padding:14px;border:2px solid #c9d8da;background:#f6faf8;color:#23434b}button:focus-visible,a:focus-visible{outline:3px solid #efad34;outline-offset:2px}.answers{display:grid;gap:11px}.answers button{text-align:left;font-weight:700;font-size:1.08rem}.answers button.selected{background:#d9f0e9;border-color:#167d73}.answers button.correct{background:#d9f3e1;border-color:#239c62}.answers button.wrong{background:#ffe6dd;border-color:#cb624b}.primary{background:#147981;color:white;border-color:#147981;font-weight:700}.primary:disabled{opacity:.45;cursor:default}.bar{height:14px;border-radius:12px;background:#e3e9e7;overflow:hidden}.bar>div{height:100%;background:#2d9987;transition:width .2s}.feedback{background:#fff2d4;border-radius:12px;padding:13px;margin-top:14px}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.score{font-size:clamp(2.5rem,12vw,4.5rem);font-weight:800;text-align:center;color:#12755b}.muted{color:#596773;font-size:.88rem}a{color:#166c79}header a{color:#bce9ed}#result[hidden],#questionPanel[hidden],#feedback[hidden]{display:none}@media(max-width:400px){section{padding:15px}.nav button{padding:11px}.answers button{font-size:1rem}}
.journal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}.journal-cell{min-width:0;padding:13px 10px;border-radius:12px;background:#e7f1fc;border:2px solid #9ac8ec}.journal-cell:last-child{background:#e7f5e9;border-color:#7dcfa1}.journal-cell span{display:block;font-size:.78rem;margin-bottom:12px;font-weight:700}.journal-cell strong{display:block;font-size:clamp(.95rem,3.6vw,1.2rem);overflow-wrap:anywhere;line-height:1.6}.journal-cell .blank{color:#9b5a08;background:#fff0ba;border-radius:5px;padding:2px 5px}@media(max-width:360px){.journal-cell{padding:9px 6px}.journal-cell span{font-size:.72rem}} </style></head><body><main><header><h1>🏆 レモネード屋さんの商人チャレンジ！</h1><p>⛵ きみも商人になって、帳簿（ちょうぼ）のなぞに挑戦（ちょうせん）しよう！</p><a href="../">← レモネード屋さんに もどる</a></header><section id="questionPanel"><p id="progress" aria-live="polite"></p><div class="bar"><div id="progressBar"></div></div><h2 id="question"></h2><div class="journal" aria-label="しわけの ひだりと みぎ"><div class="journal-cell"><span>ひだり（借方・かりかた）</span><strong id="journalLeft"></strong></div><div class="journal-cell"><span>みぎ（貸方・かしかた）</span><strong id="journalRight"></strong></div></div><p class="muted">（？）に はいる こたえを えらぼう！</p><div id="answers" class="answers" role="group" aria-label="こたえを えらぶ"></div><p id="feedback" class="feedback" aria-live="polite" hidden></p><div class="nav"><span id="status">10もん × 10てん</span><button id="next" class="primary" disabled>こたえあわせ →</button></div></section><section id="result" hidden><h2>🎉 クイズ おわり！</h2><div class="score" id="score" aria-live="polite"></div><p id="message"></p><p id="review"></p><button id="retry" class="primary">🔁 もういちど あそぶ</button></section><section><p class="muted">10もん・100てんまんてん。まちがえても だいじょうぶ！ こたえの りゆうを よんで、なんどでも ちょうせんしよう。</p><p><a href="../kids/">🌱 やさしい レモネード屋さんへ →</a></p></section></main><script type="module" src="./app.js"></script></body></html>
