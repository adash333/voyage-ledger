<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>れもねーどやさん — やさしい ぼき</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6ee;color:#263647;font-family:system-ui,sans-serif}main{max-width:740px;margin:auto;padding:12px}header{background:#176b70;color:white;padding:22px;border-radius:20px}h1{font-size:clamp(1.45rem,5vw,2rem)}h2{font-size:1.2rem}p{line-height:1.8}section{background:white;border-radius:17px;padding:17px;margin:14px 0}a{color:#166c79}header a{color:#fff}.stats,.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#e6f3ec;border-radius:13px;padding:14px;min-width:0}.tile strong{display:block;font-size:1.4rem}.tile small{display:block}button{background:#167c80;color:white;border:0;border-radius:12px;padding:14px 18px;font-size:1.05rem;cursor:pointer}button:disabled{opacity:.4}.tip{background:#fff4d6;border-radius:12px;padding:14px;line-height:1.8}.step{font-weight:700;color:#176b70}.pair .tile{background:#eaf1ff}.pair .tile:last-child{background:#e7f6ea}.pair strong{font-size:1.1rem}.muted{font-size:.9rem;color:#516270}.controls{display:flex;gap:8px;justify-content:space-between;align-items:center}.controls button{font-size:.92rem;padding:11px}.value{font-size:1.45rem;font-weight:700}input[type=range]{width:100%}@media(max-width:380px){section{padding:12px}.tile{padding:10px}.tile strong{font-size:1.15rem}} .controls[aria-label]{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #dce8df}.controls button{min-height:44px} </style></head><body><main><header><h1>🍋 れもねーどやさん</h1><p>じぶんの おかねと、おうちの ひとから かりた おかねで、おみせを はじめよう！</p><a href="../">むずかしい ことばの ばんへ →</a></header><section><nav class="controls" aria-label="うえの ステップいどう"><button id="prevTop">← まえへ</button><span id="counterTop"></span><button id="nextTop">つぎへ →</button></nav><p class="step" id="stage"></p><h2 id="title"></h2><p id="story"></p><div class="stats"><div class="tile">💰 おみせの おかね<strong id="cash"></strong></div><div class="tile">🍋 ざいりょう<strong id="materials"></strong></div><div class="tile">🤝 かりた おかね<strong id="debt"></strong></div><div class="tile">🌟 もうけ<strong id="profit"></strong></div></div></section><section><h2>📒 ひだり と みぎ の メモ</h2><div class="pair"><div class="tile"><b>ひだり</b><strong id="debit"></strong></div><div class="tile"><b>みぎ</b><strong id="credit"></strong></div></div><p class="tip" id="lesson"></p></section><section><h2>⚖ おかねの バランス</h2><p id="balance"></p><p class="tip">おみせが もっている ものと、その おかねが どこから きたかを くらべるよ。</p></section><section class="controls"><button id="prev">← まえへ</button><span id="counter"></span><button id="next">つぎへ →</button></section><section><p><a href="../quiz/">🏆 れもねーどやさんの クイズへ →</a></p><p><a href="../../kids/">⛵ こしょうやさん も あそぶ →</a></p></section></main><script type="module" src="./app.js"></script></body></html>
